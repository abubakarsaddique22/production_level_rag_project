global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexora-api
    # The app mounts the metrics app at /metrics, so use the trailing slash (no redirect).
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
